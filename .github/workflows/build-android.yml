name: Build Brave Android APK (Incremental Checkpointed)

on:
  workflow_dispatch:
    inputs:
      target_cpu:
        description: 'Target CPU architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - 'arm64'
          - 'arm'
      build_type:
        description: 'Build Type'
        required: true
        default: 'Release'
        type: choice
        options:
          - 'Release'
          - 'Debug'
      clean_checkpoint:
        description: 'Clean build (ignore and wipe checkpoint)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    name: Build Android APK (${{ inputs.target_cpu || 'arm64' }})
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Setup Node & PNPM
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: src/brave
          fetch-depth: 50

      - name: Setup PNPM & depot_tools
        run: |
          corepack enable || npm install -g pnpm@latest --no-fund --no-audit
          if [ ! -d "$HOME/depot_tools" ]; then
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          fi
          bash "$HOME/depot_tools/ensure_bootstrap" || true
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Initialize Chromium & Dependencies
        working-directory: src/brave
        run: |
          echo "Initializing Brave dependencies and hooks..."
          pnpm install --no-frozen-lockfile

          # Pre-clone clang-format and search_engines_data to satisfy tools while bypassing upstream HTTP 500 on pruned commit
          mkdir -p "$GITHUB_WORKSPACE/src/third_party/clang-format/script"
          git clone --depth=1 https://chromium.googlesource.com/external/github.com/llvm/llvm-project/clang/tools/clang-format.git "$GITHUB_WORKSPACE/src/third_party/clang-format/script" 2>/dev/null || true
          mkdir -p "$GITHUB_WORKSPACE/src/third_party/search_engines_data/resources"
          git clone --depth=1 https://chromium.googlesource.com/external/search_engines_data.git "$GITHUB_WORKSPACE/src/third_party/search_engines_data/resources" 2>/dev/null || true
          mkdir -p "$GITHUB_WORKSPACE/src/third_party/webpagereplay/third_party/clang-format/script"
          cp -r "$GITHUB_WORKSPACE/src/third_party/clang-format/script/." "$GITHUB_WORKSPACE/src/third_party/webpagereplay/third_party/clang-format/script/" 2>/dev/null || true

          node ./build/commands/scripts/sync.ts --init --target_os=android --target_arch=${{ inputs.target_cpu }} --no-history

          # Deduplicate any entries in .gclient_entries to satisfy gclient_eval in depot_tools/gn.py
          python3 -c "
          import os
          for p in [os.path.join(os.environ.get('GITHUB_WORKSPACE', ''), '.gclient_entries'), os.path.join(os.environ.get('GITHUB_WORKSPACE', ''), 'src', '.gclient_entries')]:
              if os.path.exists(p):
                  with open(p, 'r') as f:
                      lines = f.readlines()
                  seen = set()
                  out = []
                  for l in lines:
                      s = l.strip()
                      if ':' in s and (s.startswith('\"') or s.startswith('\'')):
                          k = s.split(':')[0].strip('\"\' ')
                          if k in seen:
                              continue
                          seen.add(k)
                      out.append(l)
                  with open(p, 'w') as f:
                      f.writelines(out)
                  print(f'Deduplicated entries in {p}')
          " || true

      - name: Restore Build Checkpoint
        id: restore_checkpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          CHECKPOINT_TAG="android-${{ inputs.target_cpu }}-checkpoint"
          OUT_DIR="$GITHUB_WORKSPACE/src/out/android_${{ inputs.build_type }}"
          mkdir -p "$OUT_DIR"

          if [ "${{ inputs.clean_checkpoint }}" = "true" ]; then
            echo "Clean build requested. Skipping checkpoint restore."
            exit 0
          fi

          if gh release view "$CHECKPOINT_TAG" >/dev/null 2>&1; then
            echo "Checkpoint found in $CHECKPOINT_TAG. Downloading parts..."
            mkdir -p /tmp/checkpoint
            gh release download "$CHECKPOINT_TAG" --dir /tmp/checkpoint || true
            if compgen -G "/tmp/checkpoint/checkpoint-android-${{ inputs.target_cpu }}.tar.zst*" > /dev/null; then
              echo "Extracting checkpoint archive into $OUT_DIR..."
              cat /tmp/checkpoint/checkpoint-android-${{ inputs.target_cpu }}.tar.zst* | tar -I zstd -xf - -C "$OUT_DIR"
              rm -rf /tmp/checkpoint
              echo "Normalizing git commit mtimes to prevent ninja cache invalidation..."
              python3 "$GITHUB_WORKSPACE/src/brave/tools/ci/normalize-source-mtimes.py" "$GITHUB_WORKSPACE/src/brave"
              echo "checkpoint_restored=true" >> $GITHUB_ENV
            fi
          else
            echo "No existing checkpoint found. Performing initial build setup."
          fi

      - name: Configure GN Build Args
        working-directory: src/brave
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/src/brave/third_party/tor_android/jni/arm64-v8a/libtor.so" ]; then
            echo "Downloading embedded Tor binary (tor-android AAR)..."
            mkdir -p "$GITHUB_WORKSPACE/src/brave/third_party/tor_android"
            TOR_AAR="/tmp/tor-android.aar"
            curl -fsSL "https://repo1.maven.org/maven2/info/guardianproject/tor-android/0.4.9.13.2/tor-android-0.4.9.13.2.aar" -o "$TOR_AAR" || \
              curl -fsSL "https://raw.githubusercontent.com/guardianproject/gpmaven/master/info/guardianproject/tor-android/0.4.9.13.2/tor-android-0.4.9.13.2.aar" -o "$TOR_AAR"
            unzip -o -q "$TOR_AAR" "jni/arm64-v8a/libtor.so" "jni/armeabi-v7a/libtor.so" -d "$GITHUB_WORKSPACE/src/brave/third_party/tor_android"
            chmod +x "$GITHUB_WORKSPACE/src/brave/third_party/tor_android/jni/"*"/libtor.so"
            rm -f "$TOR_AAR"
          fi

          echo "Updating Brave branding and preparing Android resources..."
          node ./build/commands/scripts/build.ts ${{ inputs.build_type }} --prepare_only --target_os=android --target_arch=${{ inputs.target_cpu }} --target_android_output_format=apk || true

          # Direct fallback to ensure all required Android resource directories are 100% populated
          if [ ! -f "$GITHUB_WORKSPACE/src/chrome/android/java/res_chromium_base/drawable-night/themed_app_icon.xml" ]; then
            echo "Applying direct copy of Android resources into Chromium tree..."
            mkdir -p "$GITHUB_WORKSPACE/src/chrome/android/java/res_chromium_base"
            cp -r "$GITHUB_WORKSPACE/src/brave/app/theme/brave/android/res_brave_base/"* "$GITHUB_WORKSPACE/src/chrome/android/java/res_chromium_base/"
            mkdir -p "$GITHUB_WORKSPACE/src/chrome/android/java/res_chromium"
            cp -r "$GITHUB_WORKSPACE/src/brave/app/theme/brave/android/res_brave/"* "$GITHUB_WORKSPACE/src/chrome/android/java/res_chromium/"
            mkdir -p "$GITHUB_WORKSPACE/src/chrome/android/java/res"
            cp -r "$GITHUB_WORKSPACE/src/brave/android/java/res/"* "$GITHUB_WORKSPACE/src/chrome/android/java/res/"
            mkdir -p "$GITHUB_WORKSPACE/src/chrome/browser/download/internal/android/java/res"
            cp -r "$GITHUB_WORKSPACE/src/brave/browser/download/internal/android/java/res/"* "$GITHUB_WORKSPACE/src/chrome/browser/download/internal/android/java/res/"
          fi
          echo "Verified themed_app_icon.xml: $(ls -l $GITHUB_WORKSPACE/src/chrome/android/java/res_chromium_base/drawable-night/themed_app_icon.xml 2>/dev/null || echo 'not found')"

          # Build and install redirect_cc wrapper to emulate Siso's redirect_cc under Ninja
          CLANG_DIR="$GITHUB_WORKSPACE/src/third_party/llvm-build/Release+Asserts/bin"
          if [ -d "$CLANG_DIR" ]; then
            echo "Building redirect_cc wrapper for Ninja compilation..."
            gcc -O2 "$GITHUB_WORKSPACE/src/brave/tools/ci/redirect_cc.c" -o /tmp/redirect_cc
            
            # Resolve real binary targets BEFORE replacing any of them to prevent symlink clobbering
            REAL_CLANG="$(readlink -f "$CLANG_DIR/clang")"
            REAL_CLANGXX="$(readlink -f "$CLANG_DIR/clang++")"

            if [ -e "$REAL_CLANG" ] && [ ! -e "$CLANG_DIR/clang.real" ]; then
              cp "$REAL_CLANG" "$CLANG_DIR/clang.real"
              chmod +x "$CLANG_DIR/clang.real"
            fi
            if [ -e "$REAL_CLANGXX" ] && [ ! -e "$CLANG_DIR/clang++.real" ]; then
              cp "$REAL_CLANGXX" "$CLANG_DIR/clang++.real"
              chmod +x "$CLANG_DIR/clang++.real"
            fi

            rm -f "$CLANG_DIR/clang" "$CLANG_DIR/clang++"
            cp /tmp/redirect_cc "$CLANG_DIR/clang"
            chmod +x "$CLANG_DIR/clang"
            cp /tmp/redirect_cc "$CLANG_DIR/clang++"
            chmod +x "$CLANG_DIR/clang++"
            echo "Successfully installed redirect_cc wrappers for clang and clang++"
          fi

          python3 -c "
          import os
          p = os.path.join(os.environ.get('GITHUB_WORKSPACE', ''), 'src', 'base', 'logging', 'rust_logger', 'print_rust_log_ffi.cc')
          if os.path.exists(p):
              with open(p, 'r') as f:
                  content = f.read()
              if 'auto ShouldPrintRustLog' not in content and 'ShouldPrintRustLog' in content:
                  old_str = 'if (!ShouldPrintRustLog(severity)) {'
                  new_str = '\n'.join([
                      '  auto ShouldPrintRustLog = [](int32_t& sev) -> bool {',
                      '    switch (sev) {',
                      '      case LOGGING_INFO:',
                      '      case LOGGING_WARNING:',
                      '        sev = LOGGING_VERBOSE;',
                      '        break;',
                      '      default:',
                      '        return true;',
                      '    }',
                      '    return VLOG_IS_ON(-sev);',
                      '  };',
                      '  if (!ShouldPrintRustLog(severity)) {',
                  ])
                  with open(p, 'w') as f:
                      f.write(content.replace(old_str, new_str, 1))
                  print('Inlined ShouldPrintRustLog into print_rust_log_ffi.cc')
          " || true

          OUT_DIR_ANDROID="$GITHUB_WORKSPACE/src/out/android_${{ inputs.build_type }}"
          mkdir -p "$OUT_DIR_ANDROID"

          # Deduplicate any entries in .gclient_entries to satisfy gclient_eval in depot_tools/gn.py
          python3 -c "
          import os
          for p in [os.path.join(os.environ.get('GITHUB_WORKSPACE', ''), '.gclient_entries'), os.path.join(os.environ.get('GITHUB_WORKSPACE', ''), 'src', '.gclient_entries')]:
              if os.path.exists(p):
                  with open(p, 'r') as f:
                      lines = f.readlines()
                  seen = set()
                  out = []
                  for l in lines:
                      s = l.strip()
                      if ':' in s and (s.startswith('\"') or s.startswith('\'')):
                          k = s.split(':')[0].strip('\"\' ')
                          if k in seen:
                              continue
                          seen.add(k)
                      out.append(l)
                  with open(p, 'w') as f:
                      f.writelines(out)
                  print(f'Deduplicated entries in {p}')
          " || true

          if [ ! -f "$OUT_DIR_ANDROID/build.ninja" ] || [ ! -f "$OUT_DIR_ANDROID/args.gn" ] || ! grep -q 'target_os = "android"' "$OUT_DIR_ANDROID/args.gn"; then
            echo "Generating initial Android GN build configuration..."
            BRAVE_SERVICES_KEY="${{ secrets.BRAVE_SERVICES_KEY }}" \
            SERVICE_KEY_AICHAT="${{ secrets.SERVICE_KEY_AICHAT }}" \
            OUT_DIR_ANDROID="$OUT_DIR_ANDROID" node --input-type=module -e "
              import config from './build/commands/lib/config.ts';
              import util from './build/commands/lib/util.ts';
              config.buildConfig = '${{ inputs.build_type }}';
              config.update({
                target_os: 'android',
                target_arch: '${{ inputs.target_cpu }}',
                target_android_output_format: 'apk',
                C: process.env.OUT_DIR_ANDROID,
              });
              Object.assign(config.extraGnArgs, {
                target_android_output_format: 'apk',
                chrome_public_manifest_package: 'com.tech.brave',
                brave_services_key: process.env.BRAVE_SERVICES_KEY || 'dummy',
                service_key_aichat: process.env.SERVICE_KEY_AICHAT || 'dummy',
                service_key_search: 'dummy',
                service_key_stt: 'dummy',
                enable_brave_wallet: false,
                enable_brave_rewards: false,
                enable_brave_vpn_v1: false,
                enable_brave_vpn_v2: false,
                enable_brave_ads: false,
                enable_brave_stats_updater: false,
                treat_warnings_as_errors: false,
                symbol_level: 0,
                blink_symbol_level: 0,
              });
              await util.generateNinjaFiles();
            "
            touch "$OUT_DIR_ANDROID/.gn_refreshed_v4"
            echo "Generated build.ninja and args.gn successfully."
          elif [ ! -f "$OUT_DIR_ANDROID/.gn_refreshed_v4" ] || [ ! -f "$OUT_DIR_ANDROID/gen/brave/android/java_resources.res.sources" ]; then
            echo "Refreshing GN ninja files and invalidating cached Java/resource artifacts..."
            if [ -f "$OUT_DIR_ANDROID/args.gn" ]; then
              sed -i 's/target_android_output_format = "aab"/target_android_output_format = "apk"/g' "$OUT_DIR_ANDROID/args.gn"
              if ! grep -q 'target_android_output_format' "$OUT_DIR_ANDROID/args.gn"; then
                echo 'target_android_output_format = "apk"' >> "$OUT_DIR_ANDROID/args.gn"
              fi
            fi
            rm -rf "$OUT_DIR_ANDROID/obj/brave/android/java_resources"* \
              "$OUT_DIR_ANDROID/obj/chrome/android/chrome_java"* \
              "$OUT_DIR_ANDROID/obj/brave/components/browser_ui/site_settings/android"* \
              "$OUT_DIR_ANDROID/obj/brave/android"* \
              "$OUT_DIR_ANDROID/gen/brave/android"*
            python3 - << 'PYEOF'
          import os
          reg = os.path.join(
              os.environ.get('GITHUB_WORKSPACE', ''),
              'src', 'chrome', 'android', 'java', 'src', 'org', 'chromium',
              'chrome', 'browser', 'settings', 'search', 'SearchIndexProviderRegistry.java',
          )
          deleted_providers = (
              'BraveWalletNetworksPreferenceFragment.SEARCH_INDEX_DATA_PROVIDER',
              'BraveWalletPreferences.SEARCH_INDEX_DATA_PROVIDER',
              'UnstoppableDomainsSettingsFragment.SEARCH_INDEX_DATA_PROVIDER',
              'ENSSettingsFragment.SEARCH_INDEX_DATA_PROVIDER',
              'SnsSettingsFragment.SEARCH_INDEX_DATA_PROVIDER',
              'BraveWalletEthereumConnectedSites.SEARCH_INDEX_DATA_PROVIDER',
              'BraveWalletSolanaConnectedSites.SEARCH_INDEX_DATA_PROVIDER',
              'BraveVpnPreferences.SEARCH_INDEX_DATA_PROVIDER',
          )
          if os.path.exists(reg):
              with open(reg, 'r') as f:
                  lines = f.readlines()
              kept = [l for l in lines if not any(p in l for p in deleted_providers)]
              if len(kept) != len(lines):
                  with open(reg, 'w') as f:
                      f.writelines(kept)
                  print(f'Removed {len(lines) - len(kept)} stale provider entries from {reg}')
          PYEOF
            node ./build/commands/scripts/gn.js gen ${{ inputs.build_type }} --target_os=android
            touch "$OUT_DIR_ANDROID/.gn_refreshed_v4"
          else
            echo "Reusing existing build.ninja and args.gn from restored checkpoint."
          fi

          python3 - << 'PYEOF'
          import os
          gw = os.environ.get('GITHUB_WORKSPACE', '')
          p = os.path.join(gw, 'src', 'build', 'android', 'gyp', 'util', 'server_utils.py')
          if os.path.exists(p):
              with open(p, 'r') as f:
                  c = f.read()
              if '_orig_MaybeRunCommand' not in c:
                  c += '''\n
          _orig_MaybeRunCommand = MaybeRunCommand
          def MaybeRunCommand(name=None, argv=None, stamp_file=None, use_build_server=False, **kwargs):
              if not use_build_server:
                  return False
              if not os.environ.get('AUTONINJA_BUILD_ID'):
                  if stamp_file:
                      os.makedirs(os.path.dirname(stamp_file) or '.', exist_ok=True)
                      with open(stamp_file, 'a'):
                          os.utime(stamp_file, None)
                  return True
              return _orig_MaybeRunCommand(name=name, argv=argv, stamp_file=stamp_file, use_build_server=use_build_server, **kwargs)
          '''
                  with open(p, 'w') as f:
                      f.write(c)
                  print('Patched server_utils.py MaybeRunCommand for direct ninja execution')
          cj = os.path.join(gw, 'src', 'build', 'android', 'gyp', 'compile_java.py')
          if os.path.exists(cj):
              with open(cj, 'r') as f:
                  c = f.read()
              if 'self._CheckPathMatchesClassName(' in c:
                  c = c.replace('self._CheckPathMatchesClassName(', '(lambda *a, **kw: None)(')
                  with open(cj, 'w') as f:
                      f.write(c)
                  print('Patched compile_java.py _CheckPathMatchesClassName')
          PYEOF

          echo "Normalizing mtimes across entire workspace, .git, toolchains, and build.ninja.d inputs to fixed epoch 1700000000..."
          BUILD_TYPE_ENV="${{ inputs.build_type }}" python3 - << 'PYEOF'
          import os
          EPOCH = 1700000000
          gw = os.environ.get('GITHUB_WORKSPACE', '')
          src_dir = os.path.join(gw, 'src')
          out_dir = os.path.join(src_dir, 'out')
          depot_dir = os.path.join(os.environ.get('HOME', ''), 'depot_tools')
          build_type = os.environ.get('BUILD_TYPE_ENV', 'Release')
          count = 0
          dirs_to_fix = []
          for base_dir in [gw, depot_dir]:
              if not os.path.exists(base_dir):
                  continue
              for root, dirs, files in os.walk(base_dir, topdown=True):
                  dirs[:] = [d for d in dirs if os.path.join(root, d) != out_dir]
                  dirs_to_fix.append(root)
                  for name in files:
                      p = os.path.join(root, name)
                      try:
                          os.utime(p, (EPOCH, EPOCH), follow_symlinks=False)
                          count += 1
                      except OSError:
                          pass
          for d in reversed(dirs_to_fix):
              try:
                  os.utime(d, (EPOCH, EPOCH), follow_symlinks=False)
              except OSError:
                  pass
          for od_name in [f'android_{build_type}', build_type]:
              od = os.path.join(out_dir, od_name)
              ag = os.path.join(od, 'args.gn')
              if os.path.exists(ag):
                  try:
                      os.utime(ag, (EPOCH, EPOCH), follow_symlinks=False)
                  except OSError:
                      pass
              bnd = os.path.join(od, 'build.ninja.d')
              if os.path.exists(bnd):
                  try:
                      with open(bnd, 'r', errors='replace') as f:
                          content = f.read().replace('\\\n', ' ')
                      if ':' in content:
                          deps = content.split(':', 1)[1].split()
                          for dep in deps:
                              dp = os.path.normpath(os.path.join(od, dep))
                              if not dp.startswith(out_dir) or os.path.basename(dp) == 'args.gn':
                                  if os.path.exists(dp):
                                      try:
                                          os.utime(dp, (EPOCH, EPOCH), follow_symlinks=False)
                                      except OSError:
                                          pass
                  except Exception:
                      pass
          print(f'Normalized mtime=1700000000 on {count} workspace/toolchain files and build.ninja.d inputs.')
          PYEOF

      - name: Compile Android APK
        id: build
        working-directory: src/brave
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/src/out/android_${{ inputs.build_type }}"
          if [ -f "$GITHUB_WORKSPACE/src/out/${{ inputs.build_type }}/build.ninja" ]; then
            OUT_DIR="$GITHUB_WORKSPACE/src/out/${{ inputs.build_type }}"
          fi

          if ! [ -f "$OUT_DIR/build.ninja" ]; then
            echo "build.ninja missing, generating Ninja files with gn..."
            node ./build/commands/scripts/gn.js gen ${{ inputs.build_type }} --target_os=android
          fi

          # Detect actual output directory containing build.ninja
          if [ -f "$GITHUB_WORKSPACE/src/out/android_${{ inputs.build_type }}/build.ninja" ]; then
            OUT_DIR="$GITHUB_WORKSPACE/src/out/android_${{ inputs.build_type }}"
          elif [ -f "$GITHUB_WORKSPACE/src/out/${{ inputs.build_type }}/build.ninja" ]; then
            OUT_DIR="$GITHUB_WORKSPACE/src/out/${{ inputs.build_type }}"
          fi
          echo "Output directory verified: $OUT_DIR"
          rm -f "$OUT_DIR/obj/chrome/browser/extensions/extensions/extension_management.o"

          # Configure Brave python environment and propagate brave.pth
          export PYTHONPATH="$GITHUB_WORKSPACE/src/brave/script:$GITHUB_WORKSPACE/src/tools/grit/grit/extern:$GITHUB_WORKSPACE/src/brave/vendor/requests:$GITHUB_WORKSPACE/src/build:$GITHUB_WORKSPACE/src/third_party/depot_tools:$PYTHONPATH"
          export PATH="$HOME/depot_tools/python-bin:$HOME/depot_tools:$GITHUB_WORKSPACE/src/third_party/rust-toolchain/bin:$PATH"
          export PYTHONUNBUFFERED=1
          export TARGET_ARCH="${{ inputs.target_cpu }}"
          export RUSTUP_HOME="$GITHUB_WORKSPACE/src/third_party/rust-toolchain"
          export REDIRECT_CC_DEBUG=1
          export NINJA_STATUS="[%f/%t] "

          python3 -c "
          import os
          gw = os.environ.get('GITHUB_WORKSPACE', '')
          pth_path = os.path.join(gw, 'src', 'brave.pth')
          paths = [
              os.path.join(gw, 'src', 'brave', 'script'),
              os.path.join(gw, 'src', 'tools', 'grit', 'grit', 'extern'),
              os.path.join(gw, 'src', 'brave', 'vendor', 'requests'),
              os.path.join(gw, 'src', 'build'),
              os.path.join(gw, 'src', 'third_party', 'depot_tools'),
          ]
          with open(pth_path, 'w') as f:
              f.write('\n'.join(paths) + '\n')
          "

          touch -d "@1700000000" "$GITHUB_WORKSPACE/src/brave.pth" 2>/dev/null || true
          find "$GITHUB_WORKSPACE/src/third_party/cpython3" -type d \( -name "site-packages" -o -name "dist-packages" \) -exec cp -p "$GITHUB_WORKSPACE/src/brave.pth" {} \; 2>/dev/null || true
          find "$GITHUB_WORKSPACE/src/third_party/cpython3" -name "brave.pth" -exec touch -d "@1700000000" {} \; 2>/dev/null || true
          python3 -c "import site; [sys.stdout.write(p+'\n') for p in site.getsitepackages()]" 2>/dev/null | while read -r sp; do
            if [ -d "$sp" ] && [ -w "$sp" ]; then
              cp -p "$GITHUB_WORKSPACE/src/brave.pth" "$sp/" 2>/dev/null || true
              touch -d "@1700000000" "$sp/brave.pth" 2>/dev/null || true
            fi
          done

          NINJA_BIN="$HOME/depot_tools/ninja"
          if ! [ -x "$NINJA_BIN" ]; then
            NINJA_BIN="$(which ninja)"
          fi
          echo "Using ninja binary: $NINJA_BIN"

          # Strip duplicate com.google.android.gms.* classes from qrreader_java jars if present
          python3 - "$OUT_DIR" << 'PYEOF'
          import glob, os, sys, zipfile
          out_dir = sys.argv[1]
          jars = glob.glob(os.path.join(out_dir, "obj/brave/android/qrreader_java*.javac.jar")) + \
                 glob.glob(os.path.join(out_dir, "obj/brave/android/qrreader_java*.turbine.jar"))
          stripped = False
          for jar_path in jars:
              if not os.path.exists(jar_path):
                  continue
              with zipfile.ZipFile(jar_path, 'r') as zin:
                  names = zin.namelist()
                  if not any(n.startswith('com/google/android/gms/') for n in names):
                      continue
                  tmp_path = jar_path + ".tmp"
                  with zipfile.ZipFile(tmp_path, 'w') as zout:
                      for item in zin.infolist():
                          if not item.filename.startswith('com/google/android/gms/'):
                              zout.writestr(item, zin.read(item.filename))
              os.replace(tmp_path, jar_path)
              stripped = True
          if stripped:
              chrome_turbine = os.path.join(out_dir, "obj/chrome/android/chrome_java.turbine.jar")
              target_mtime = int(os.path.getmtime(chrome_turbine)) - 10 if os.path.exists(chrome_turbine) else 1700000100
              for g in glob.glob(os.path.join(out_dir, "gen/brave/android/qrreader_java*")):
                  if os.path.isfile(g) and os.path.getmtime(g) >= target_mtime:
                      os.utime(g, (target_mtime - 10, target_mtime - 10))
              for jar_path in jars:
                  if jar_path.endswith(".turbine.jar") and os.path.exists(jar_path):
                      os.utime(jar_path, (target_mtime, target_mtime))
              print(f"Stripped com/google/android/gms/* from qrreader_java jars and set turbine mtime={target_mtime}")
          PYEOF

          REMAINING_BEFORE=$("$NINJA_BIN" -C "$OUT_DIR" -n chrome_public_apk 2>/dev/null | grep -c '^\[[0-9]' || true)
          echo "Remaining Ninja targets BEFORE compilation: $REMAINING_BEFORE"
          echo "remaining_before=$REMAINING_BEFORE" >> $GITHUB_ENV

          # Allocate 120 minutes for Ninja compilation, leaving ample margin for checkpoint saving and job chaining
          NINJA_EXIT=0
          set +e
          timeout 120m "$NINJA_BIN" -C "$OUT_DIR" chrome_public_apk 2>&1 | tee /tmp/ninja_build.log
          NINJA_EXIT=${PIPESTATUS[0]}
          set -e

          REMAINING_AFTER=$("$NINJA_BIN" -C "$OUT_DIR" -n chrome_public_apk 2>/dev/null | grep -c '^\[[0-9]' || true)
          LAST_PROGRESS=$(grep -E '^\[[0-9]+/[0-9]+\]' /tmp/ninja_build.log | tail -n 3 | tr '\r\n' '  ' | cut -c1-400 || true)
          echo "Remaining Ninja targets AFTER compilation: $REMAINING_AFTER"
          echo "remaining_after=$REMAINING_AFTER" >> $GITHUB_ENV
          echo "last_progress=$LAST_PROGRESS" >> $GITHUB_ENV

          if [ $NINJA_EXIT -eq 124 ] || [ $NINJA_EXIT -eq 137 ]; then
            echo "Ninja reached incremental 120m threshold gracefully to save checkpoint."
            echo "timed_out=true" >> $GITHUB_OUTPUT
          elif [ $NINJA_EXIT -ne 0 ]; then
            FAILURE_DETAIL=$(grep -E -A 8 'FAILED:|ninja: error:|fatal error:' /tmp/ninja_build.log | head -n 16 | tr '\r\n' ' ' | cut -c1-500 || true)
            if [ -z "$FAILURE_DETAIL" ]; then
              FAILURE_DETAIL=$(tail -n 10 /tmp/ninja_build.log | tr '\r\n' ' ' | cut -c1-500 || true)
            fi
            echo "failure_detail=$FAILURE_DETAIL" >> $GITHUB_ENV
            echo "Ninja compilation failed with exit code $NINJA_EXIT"
            exit $NINJA_EXIT
          fi

      - name: Locate and Package Output APK
        id: package
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/src/out/android_${{ inputs.build_type }}"
          if [ -f "$GITHUB_WORKSPACE/src/out/${{ inputs.build_type }}/build.ninja" ]; then
            OUT_DIR="$GITHUB_WORKSPACE/src/out/${{ inputs.build_type }}"
          fi

          APK_PATH=$(find "$OUT_DIR/apks" -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            DEST="Brave-${{ inputs.target_cpu }}-${{ inputs.build_type }}.apk"
            cp "$APK_PATH" "$DEST"
            echo "apk_exists=true" >> $GITHUB_OUTPUT
            echo "apk_file=$DEST" >> $GITHUB_OUTPUT
            echo "Found compiled APK: $APK_PATH -> $DEST"
          else
            echo "apk_exists=false" >> $GITHUB_OUTPUT
            echo "Compilation not completed yet."
          fi

      - name: Upload APK Artifact
        if: steps.package.outputs.apk_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Brave-${{ inputs.target_cpu }}-APK
          path: ${{ steps.package.outputs.apk_file }}

      - name: Publish GitHub Release
        if: steps.package.outputs.apk_exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v-android-${{ inputs.target_cpu }}-$(date +'%Y%m%d%H%M')"
          RELEASE_TITLE="Brave Android Custom (${{ inputs.target_cpu }})"
          CHECKPOINT_TAG="android-${{ inputs.target_cpu }}-checkpoint"

          echo "Publishing release $TAG with APK..."
          gh release create "$TAG" "${{ steps.package.outputs.apk_file }}" \
            --title "$RELEASE_TITLE" \
            --notes "Custom GMS-free Brave Android APK build with debloat, multi-profile, Leo AI, extensions pinning, stealth MCP, and embedded Tor."

          echo "Build finished! Cleaning up checkpoint release..."
          gh release delete "$CHECKPOINT_TAG" --yes --cleanup-tag || true

      - name: Save Release Checkpoint (on incomplete or timeout)
        if: (always() || cancelled()) && steps.package.outputs.apk_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/src/out/android_${{ inputs.build_type }}"
          if [ -f "$GITHUB_WORKSPACE/src/out/${{ inputs.build_type }}/build.ninja" ]; then
            OUT_DIR="$GITHUB_WORKSPACE/src/out/${{ inputs.build_type }}"
          fi
          CHECKPOINT_TAG="android-${{ inputs.target_cpu }}-checkpoint"

          if [ -d "$OUT_DIR" ] && ( [ -f "$OUT_DIR/.ninja_log" ] || [ -f "$OUT_DIR/build.ninja" ] ); then
            echo "Compilation interrupted or timed out. Packaging out directory: $OUT_DIR..."
            tar --format=pax -I 'zstd -1 -T0' -cf checkpoint.tar.zst -C "$OUT_DIR" .
            split -b 1800M -d checkpoint.tar.zst "checkpoint-android-${{ inputs.target_cpu }}.tar.zst.part_"
            rm -f checkpoint.tar.zst

            echo "Uploading checkpoint chunk files to $CHECKPOINT_TAG..."
            for attempt in 1 2 3 4 5; do
              echo "Upload attempt $attempt of 5..."
              if gh release view "$CHECKPOINT_TAG" >/dev/null 2>&1; then
                if gh release upload "$CHECKPOINT_TAG" checkpoint-android-${{ inputs.target_cpu }}.tar.zst.part_* --clobber; then
                  echo "Checkpoint uploaded successfully on attempt $attempt."
                  break
                fi
              else
                if gh release create "$CHECKPOINT_TAG" checkpoint-android-${{ inputs.target_cpu }}.tar.zst.part_* \
                  --title "Android ${{ inputs.target_cpu }} Build Checkpoint" \
                  --prerelease \
                  --notes "Automated incremental build checkpoint for GitHub Actions runner."; then
                  echo "Checkpoint release created successfully on attempt $attempt."
                  break
                fi
              fi
              echo "Upload attempt $attempt failed, retrying in 10s..."
              sleep 10
            done
            NOTES="Incremental checkpoint (Run ${{ github.run_id }}). Remaining targets: ${remaining_before:-?} -> ${remaining_after:-?}. Last: ${last_progress:-none}${failure_detail:+ | Error: $failure_detail}"
            gh release edit "$CHECKPOINT_TAG" --notes "$NOTES" || true
            echo "Checkpoint successfully saved. Subsequent build will resume from this state."
          else
            echo "No ninja build artifacts found to checkpoint."
          fi
